[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "corpusshield-ot"
version = "1.0.0"
description = "Reproducible corpus-poisoning benchmark and provenance defense for security RAG"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
embedding = ["sentence-transformers>=5,<6", "torch==2.13.0"]

[project.scripts]
corpusshield-ot = "rag_sec.cli:main"

[tool.setuptools.packages.find]
include = ["rag_sec*"]
