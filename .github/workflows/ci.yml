name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install uv
        run: python -m pip install uv
      - name: Install project
        run: uv sync --locked --python 3.13
      - name: Fetch pinned source data
        run: uv run --no-sync python -m rag_sec fetch-data
      - name: Run unit tests
        run: uv run --no-sync python -m unittest discover -s tests -v
